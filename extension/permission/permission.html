<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Microphone Authorization — MeetFlow AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #FAFAFD;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 250px;
      background: radial-gradient(circle at 50% -20%, rgba(124, 58, 237, 0.12), rgba(99, 102, 241, 0.05) 70%, transparent 100%);
      pointer-events: none;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px -10px rgba(124, 58, 237, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #F3E8FF;
      border-radius: 9999px;
      font-size: 11px;
      color: #7E22CE;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
      border: 1px solid rgba(147, 51, 234, 0.2);
    }
    .icon-wrap {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #EDE9FE 0%, #E0E7FF 100%);
      border: 1px solid rgba(124, 58, 237, 0.2);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 34px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.15);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0F172A;
      margin-bottom: 12px;
    }
    p {
      color: #64748B;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      background: linear-gradient(135deg, #7C3AED 0%, #6366F1 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.35);
    }
    .btn:hover {
      background: linear-gradient(135deg, #6D28D9 0%, #4F46E5 100%);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status-box {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    .status-success {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #065F46;
    }
    .status-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
    }
    .help-text {
      margin-top: 24px;
      font-size: 12px;
      color: #94A3B8;
      border-top: 1px solid #F1F5F9;
      padding-top: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">One-Time Setup</div>
    <div class="icon-wrap">🎙️</div>
    <h1>Enable Microphone Access</h1>
    <p>
      Chrome requires one-time permission for the extension so that your own voice can be recorded and mixed cleanly alongside Google Meet / Teams attendees.
    </p>

    <button id="grantBtn" class="btn">
      <span>Allow Microphone</span>
    </button>

    <div id="statusBox" class="status-box"></div>

    <div class="help-text">
      This permission is saved securely in your browser. You will only need to authorize this once.
    </div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
